<div class="exercise-card" [class.completed]="exercise.completed">
    <!-- Custom Checkbox -->
    <label class="completion-checkbox">
        <input type="checkbox" 
               [checked]="exercise.completed"
               (change)="onCompletionChange($event)"
               class="visually-hidden">
        <span class="checkmark"></span>
    </label>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="swap-btn" 
                (click)="swapExercise(); $event.stopPropagation()" 
                matTooltip="Swap exercise" 
                [disabled]="isSwapping">
            <mat-icon>swap_horiz</mat-icon>
        </button>
    </div>

    <!-- Content Section -->
    <div class="content">
        <h3>{{ exercise.name }}</h3>
        <p class="muscle-group">
            {{ exercise.main_muscle }}
            <span *ngIf="exercise.body_part && exercise.body_part !== exercise.main_muscle">
                / {{ exercise.body_part }}
            </span>
        </p>
        <div class="stats">
            <span class="sets-reps">
                {{ exercise.sets || 0 }} sets × {{ exercise.reps || 0 }} reps
            </span>
        </div>
    </div>
</div>
